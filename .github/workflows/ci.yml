# Checks every pull request and every push to master. Each job mirrors a `make` target, so
# anything that fails here can be reproduced locally with `make lint`, `make test`,
# `make audit` and `make scan`.
#
# The repository grows in slices, so every job that needs code first checks the code exists
# (job `detect`) and is skipped until it does. The last job, `CI gate`, is the one to require
# in branch protection: it passes only when everything that ran passed.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs so a moved or hijacked tag can't change what runs.
jobs:
  detect:
    name: What to check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.pick.outputs.backend }}
      frontend: ${{ steps.pick.outputs.frontend }}
      database: ${{ steps.pick.outputs.database }}
      container: ${{ steps.pick.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for the backend and the web app
        id: pick
        run: |
          {
            echo "backend=$([[ -f backend/pyproject.toml ]] && echo true || echo false)"
            echo "frontend=$([[ -f frontend/package.json ]] && echo true || echo false)"
            echo "database=$([[ -f backend/alembic.ini ]] && echo true || echo false)"
            echo "container=$([[ -f Dockerfile ]] && echo true || echo false)"
          } | tee -a "$GITHUB_OUTPUT"

  # Prettier over everything that is text: the docs, the workflows and the configuration.
  format:
    name: Formatting of docs and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The version is pinned here and in the Makefile; Dependabot raises it through the frontend's
      # own dependency once that exists.
      - name: Prettier
        run: npx --yes prettier@3.10.1 --check .

  # Linters for the repository's own plumbing: workflows, shell scripts, Dockerfiles. The
  # linters run from images pinned by digest (see the Makefile), as `make lint-infra` does.
  infrastructure:
    name: Workflows, scripts and Dockerfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint (actionlint, ShellCheck, hadolint)
        run: make lint-infra

      - name: Tests of the CI scripts
        run: make test-ci-scripts

  # Trivy over the source: vulnerable dependencies, leaked secrets and Dockerfile or compose
  # mistakes. High and critical findings with a fix fail the job; they are listed in the log
  # and uploaded to code scanning.
  trivy:
    name: Trivy (dependencies, secrets, misconfiguration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy scan of dependencies, secrets and Dockerfiles
        id: trivy-source
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-source.sarif
          exit-code: "1"
        continue-on-error: true

      - name: Show the findings
        if: ${{ steps.trivy-source.outcome == 'failure' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      # GitHub makes fork pull requests' tokens read-only, so scan them without uploading.
      - name: Upload the scan to GitHub code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-source.sarif
          category: trivy-source

      - name: Enforce the Trivy threshold
        if: ${{ !cancelled() }}
        env:
          SOURCE_SCAN_OUTCOME: ${{ steps.trivy-source.outcome }}
        run: ./.github/scripts/trivy-report.sh source "$SOURCE_SCAN_OUTCOME" trivy-source.sarif

  backend:
    name: Backend
    needs: detect
    if: ${{ needs.detect.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blindspot
          POSTGRES_DB: blindspot
          # A throwaway database only this job can reach, so no password is kept for it.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Check over TCP so the check can't pass while the init scripts' socket-only server runs.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U blindspot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Same Python as the container image.
          python-version: "3.14"
          working-directory: backend

      # Exactly the locked versions, as prebuilt wheels only, so installing runs none of the
      # packages' own code. The steps after this run the tools from that environment as is.
      - name: Install dependencies
        run: |
          uv sync --locked --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Pyright
        run: pyright

      - name: Bandit
        run: bandit -c pyproject.toml -r app

      - name: Dependency audit
        run: pip-audit

      # Only once the database layer exists (backend/alembic.ini).
      - name: Migrations on Postgres 18
        if: ${{ needs.detect.outputs.database == 'true' }}
        env:
          BLINDSPOT_DATABASE_URL: postgresql+psycopg://blindspot@127.0.0.1:5432/blindspot
        run: |
          alembic upgrade head
          # Fails if the models have changes no migration covers.
          alembic check
          alembic downgrade base
          alembic upgrade head
          # The newest migration can be applied again to a database that already has it, and
          # changes nothing. The first migration's parent is `<base>`, which `alembic stamp`
          # calls `base`.
          parent="$(alembic show head | sed -n 's/^Parent: //p')"
          alembic stamp "${parent/<base>/base}"
          alembic upgrade head
          alembic check

      # After the migration checks, because the tests replace the schema with the models' own.
      - name: Tests (95% minimum; 100% target) on Postgres 18
        env:
          BLINDSPOT_TEST_DATABASE_URL: postgresql+psycopg://blindspot@127.0.0.1:5432/blindspot
        run: pytest

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    needs: detect
    if: ${{ needs.detect.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same Node as the image's frontend build stage.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Without running any package's install scripts; none of these need one.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESLint
        run: npm run lint -- --max-warnings=0

      - name: Prettier
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests (95% minimum; 100% target)
        run: npm run coverage

      - name: Dependency audit (fail on critical)
        run: npm audit --audit-level=critical

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # Playwright against the API and the built web app on the runner, in three shards. Each shard
  # collects the web app's coverage from the browser (the build has its source maps inside, so
  # the numbers are for src/); `e2e-report` merges them and enforces the minimum.
  e2e-host:
    name: End to end, host (${{ matrix.shard }}/3)
    needs: detect
    if: ${{ needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blindspot
          POSTGRES_DB: blindspot
          # A throwaway database only this job can reach, so no password is kept for it.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U blindspot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          working-directory: backend

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the API's dependencies
        working-directory: backend
        run: uv sync --locked --no-build

      - name: Install the web app's dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the browser
        run: npm run e2e:install

      - name: Build the web app with source maps
        run: npm run build:e2e

      - name: Run this shard
        env:
          E2E_COVERAGE: "1"
          BLINDSPOT_DATABASE_URL: postgresql+psycopg://blindspot@127.0.0.1:5432/blindspot
          SHARD: ${{ matrix.shard }}
        run: npm run e2e -- --shard="$SHARD/3"

      - name: Upload the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-host-blob-${{ matrix.shard }}
          path: frontend/e2e-results/blob/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the shard's coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-host-coverage-${{ matrix.shard }}
          path: frontend/e2e-results/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # The same tests against the real image, started as people run it (read-only, capabilities
  # dropped). The image has no source maps, so this mode checks behaviour, not coverage.
  e2e-container:
    name: End to end, container (${{ matrix.shard }}/3)
    needs: detect
    if: ${{ needs.detect.outputs.container == 'true' && needs.detect.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: blindspot:e2e
          provenance: false
          sbom: false
          build-args: |
            RELEASE=e2e
            COMMIT=${{ github.sha }}
            APK_REFRESH=${{ github.run_id }}
            IMAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start the container
        run: |
          # The setup code and the relaxed limits are what e2e/accounts.ts expects; the tests
          # create many accounts and sign in often from one address.
          ./.github/scripts/run-container.sh blindspot:e2e blindspot-e2e 8443 \
            --env BLINDSPOT_SETUP_CODE=e2e-setup-code-0123456789 \
            --env BLINDSPOT_THROTTLE_FAILURES=1000 \
            --env BLINDSPOT_PASSKEY_FAILURES=1000
          ./.github/scripts/smoke-test.sh blindspot-e2e 8443

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No package cache in a job that builds the image: a poisoned cache must not reach it.
          package-manager-cache: false

      - name: Install the web app's dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the browser
        working-directory: frontend
        run: npm run e2e:install

      - name: Run this shard
        working-directory: frontend
        env:
          E2E_MODE: container
          E2E_BASE_URL: https://localhost:8443
          SHARD: ${{ matrix.shard }}
        run: npm run e2e -- --shard="$SHARD/3"

      - name: Container logs
        if: ${{ failure() }}
        run: docker logs --tail 200 blindspot-e2e || true

      - name: Upload the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-container-blob-${{ matrix.shard }}
          path: frontend/e2e-results/blob/
          if-no-files-found: ignore
          retention-days: 14

  # One HTML report per mode, and the web app's coverage merged across the host shards. Fails
  # below 80% of lines, and warns below 90%.
  e2e-report:
    name: End to end report and coverage
    needs: [detect, e2e-host, e2e-container]
    if: ${{ !cancelled() && needs.detect.outputs.frontend == 'true' && needs.e2e-host.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the web app's dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download the shards' coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-host-coverage-*
          path: frontend/e2e-shards

      - name: Merge the coverage and check it
        run: |
          shopt -s nullglob
          shards=(e2e-shards/*/)
          [[ ${#shards[@]} -gt 0 ]] || { echo "::error::No shard produced coverage."; exit 1; }
          node e2e/scripts/merge-coverage.mjs "${shards[@]}"

      - name: Add the coverage to the job summary
        if: ${{ !cancelled() }}
        run: cat e2e-results/coverage-merged/coverage-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the merged coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          path: frontend/e2e-results/coverage-merged/
          if-no-files-found: ignore
          retention-days: 14

      - name: Download the shards' reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-*-blob-*
          path: frontend/e2e-blobs
          merge-multiple: true

      - name: Merge the reports
        if: ${{ !cancelled() }}
        run: npm run e2e:report
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The container, built and run as people will run it: scanned by Trivy, started read-only with
  # every capability dropped but five, and smoke tested over https. The release builds and tests
  # the same image for both CPUs; this finds a broken image in the pull request instead.
  container:
    name: Container
    needs: detect
    if: ${{ needs.detect.outputs.container == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the image scan to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The base image's digest is what to pin it to (docs/how-to/container.md).
      - name: Show the base image
        run: docker buildx imagetools inspect cgr.dev/chainguard/wolfi-base:latest | head -8

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: blindspot:ci
          provenance: false
          sbom: false
          build-args: |
            RELEASE=ci
            COMMIT=${{ github.sha }}
            APK_REFRESH=${{ github.run_id }}
            IMAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Trivy scan of the image
        id: trivy-image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: blindspot:ci
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
        continue-on-error: true

      - name: Show the image scan findings
        if: ${{ steps.trivy-image.outcome == 'failure' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          scan-type: image
          image-ref: blindspot:ci
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Upload the image scan to GitHub code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Enforce the Trivy threshold
        env:
          IMAGE_SCAN_OUTCOME: ${{ steps.trivy-image.outcome }}
        run: ./.github/scripts/trivy-report.sh image "$IMAGE_SCAN_OUTCOME" trivy-image.sarif

      - name: Start the container
        run: ./.github/scripts/run-container.sh blindspot:ci blindspot-ci 8443

      - name: Smoke test
        run: ./.github/scripts/smoke-test.sh blindspot-ci 8443

      # A restart must find everything a first start left, and nothing it can't repeat.
      - name: Restart the container
        run: |
          docker restart blindspot-ci
          ./.github/scripts/smoke-test.sh blindspot-ci 8443

      - name: Stop cleanly
        run: |
          docker stop --timeout 40 blindspot-ci
          code="$(docker inspect --format '{{.State.ExitCode}}' blindspot-ci)"
          echo "exit code: $code"
          [[ "$code" == "0" ]]

      - name: Container logs
        if: ${{ failure() }}
        run: docker logs blindspot-ci || true

      - name: Remove the container
        if: ${{ always() }}
        run: docker rm --force --volumes blindspot-ci || true

  # SonarQube Cloud: bugs, code smells, security hotspots, duplication and coverage, held to
  # its quality gate. It needs the SONAR_TOKEN secret; without it, as on pull requests from
  # forks, the job only says so. Settings are in sonar-project.properties.
  sonarqube:
    name: SonarQube
    needs: [detect, backend, frontend]
    if: ${{ needs.detect.outputs.backend == 'true' && needs.detect.outputs.frontend == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for the SonarQube token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN isn't set, so the SonarQube analysis was skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          # The full history, so SonarQube can tell new code from old.
          fetch-depth: 0
          persist-credentials: false

      # The web app's packages too, so the TypeScript analysis sees the same types and
      # settings vue-tsc does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.SONAR_TOKEN != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the web app's packages
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download the backend's coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: backend

      - name: Download the frontend's coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Vitest writes file names relative to the web app's folder (src/App.vue), and SonarQube reads
      # them relative to the repository, so without this none of the web app's files get coverage.
      - name: Make the frontend coverage paths relative to the repository
        if: ${{ env.SONAR_TOKEN != '' }}
        run: sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info

      - name: SonarQube analysis and quality gate
        id: scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: -Dsonar.qualitygate.wait=true

      # Whenever the analysis ran: why the quality gate failed, if it did, and the new code's open
      # issues and security hotspots, so they can be fixed without opening SonarQube Cloud. Empty
      # lists aren't shown. The quality gate lets code smells through, so a pull request with any
      # open issue fails here instead, and none reach master.
      - name: What SonarQube found
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.base_ref }}
          BRANCH: ${{ github.ref_name }}
        run: ./.github/scripts/sonar-report.sh

  # The one check to require in branch protection. A skipped job (code that doesn't exist yet)
  # counts as passed; a failed or cancelled one does not.
  ci-gate:
    name: CI gate
    needs:
      [
        detect,
        format,
        infrastructure,
        trivy,
        backend,
        frontend,
        container,
        e2e-host,
        e2e-container,
        e2e-report,
        sonarqube,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Everything that ran passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
