# CodeQL code scanning. It analyses the workflows themselves always, and Python and
# JavaScript/TypeScript once the backend and frontend exist. Results appear under Security >
# Code scanning; the "CodeQL gate" job is the one to require in branch protection.
# GitHub's "default setup" for CodeQL must be turned off for this advanced workflow to upload.
name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1" # Mondays, to catch new queries on old code
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  languages:
    name: Which languages to analyse
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL fails when it finds no code for a language, so only those with code are analysed.
      - name: Pick the languages
        id: pick
        run: |
          languages='["actions"]'
          if [[ -n "$(git ls-files 'backend/*.py' | head -n 1)" ]]; then
            languages="$(jq -c '. + ["python"]' <<<"$languages")"
          fi
          if [[ -n "$(git ls-files 'frontend/*.ts' 'frontend/*.vue' 'frontend/*.js' | head -n 1)" ]]; then
            languages="$(jq -c '. + ["javascript-typescript"]' <<<"$languages")"
          fi
          echo "matrix=$languages" >> "$GITHUB_OUTPUT"
          echo "Analysing: $languages"

  analyze:
    name: Analyse (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      actions: read # read workflow run details for the upload
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  codeql-gate:
    name: CodeQL gate
    needs: [languages, analyze]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every analysis must have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
