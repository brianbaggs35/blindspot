# Included in every location that adds headers, because nginx drops the ones inherited from the
# server block as soon as a location adds its own.
#
# The Content-Security-Policy allows no inline scripts and no eval. Styles are allowed with the
# per-request nonce nginx puts in the page (see /index.html), which the web app hands to Vuetify.
# Inline style attributes (not style elements) are allowed because Vuetify sets them on its
# components; they can't run script.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS covers the whole host name, so it is opt-in: BLINDSPOT_HSTS=1 writes /run/nginx/hsts.conf.
include /run/nginx/hsts.conf;
