# nginx for Blindspot: terminates TLS 1.3, serves the web app and proxies /api to the API over
# a unix socket. Everything it writes is under /run (a tmpfs), so the image's file system can be
# read-only.
#
# The master process runs as root, as nginx always does, because only it can open /dev/stdout
# for the access log; it reads the certificate and starts the workers, which are the only
# processes that touch a request and run as the unprivileged nginx user.
user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    access_log /dev/stdout;

    client_body_temp_path /run/nginx/body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    uwsgi_temp_path /run/nginx/uwsgi;
    scgi_temp_path /run/nginx/scgi;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    upstream api {
        server unix:/run/blindspot/api.sock;
        keepalive 16;
    }

    # Plain http only redirects to https. The port people reach https on is not the container's,
    # so the entrypoint writes the redirect (BLINDSPOT_PUBLIC_HTTPS_PORT).
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        include /run/nginx/redirect.conf;
    }

    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /run/blindspot/tls/fullchain.pem;
        ssl_certificate_key /run/blindspot/tls/privkey.pem;

        root /usr/share/blindspot/web;
        limit_conn perip 50;

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 120s;
            proxy_hide_header Server;
        }

        # Live events (Server-Sent Events) are streamed, so they are not buffered and may stay open.
        location /api/events {
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_hide_header Server;
        }

        # Built files have a hash in their name, so they never change.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The page itself is never cached, and carries this request's nonce for its styles.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            sub_filter '__CSP_NONCE__' $request_id;
            sub_filter_once off;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
