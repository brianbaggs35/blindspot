# Which tools can do each WSTG test, and how. Generated from docs/research/wstg-tool-map.md.
# `risk` is the most intrusive thing a listed tool may do for the test. `manual_review` marks
# judgement work the agent does with the browser and HTTP client and a person should check.
tests:
  WSTG-INFO-01:
    tools: [b.osint, p.osint, o.searxng]
    risk: safe
    manual_review: false
    approach: "Search-engine dorks, cached/archived pages, public code and paste sites; passive"
  WSTG-INFO-02:
    tools: [b.http, p.pd, c.nmap]
    risk: active
    manual_review: false
    approach: "Banner, header ordering and error-page fingerprints; nmap -sV"
  WSTG-INFO-03:
    tools: [b.http, b.spider]
    risk: active
    manual_review: false
    approach: "robots.txt, sitemap.xml, security.txt, humans.txt, meta tags"
  WSTG-INFO-04:
    tools: [c.amass, p.pd, b.dns, c.nmap, b.osint]
    risk: active
    manual_review: false
    approach: "Subdomains, ports, virtual hosts, certificates (CT logs), cloud assets"
  WSTG-INFO-05:
    tools: [b.spider, b.jsstatic, c.whitebox, c.trufflehog]
    risk: active
    manual_review: false
    approach: "Comments, metadata, source maps, secrets in JS; Gitleaks on supplied source"
  WSTG-INFO-06:
    tools: [b.spider, b.browser, b.params]
    risk: active
    manual_review: false
    approach: "Forms, parameters, headers, cookies, API calls seen in the browser"
  WSTG-INFO-07:
