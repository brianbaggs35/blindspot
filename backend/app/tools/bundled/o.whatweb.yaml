id: o.whatweb
name: WhatWeb
tier: optional
binary: whatweb
risk: active
params:
  url: { type: target, required: true, description: "The address to identify" }
  aggression:
    {
      type: integer,
      minimum: 1,
      maximum: 3,
      default: 1,
      description: "1 asks once, 3 follows links and tries more tests",
    }
argv:
  - "--log-json=-"
  - --quiet
  - --no-errors
  - -a
  - "{aggression}"
  - "{url}"
version: { args: [--version], pattern: "([0-9]+\\.[0-9]+\\.[0-9]+)" }
timeout_s: 600
max_output_mb: 5
parsers: [whatweb_json]
homepage: https://github.com/urbanadventurer/WhatWeb
explain: "Recognises the software a site runs (server, framework, content system, scripts) from how it answers."
could_go_wrong: "At level 3 it sends extra requests that look like probing. Level 1 sends one."
