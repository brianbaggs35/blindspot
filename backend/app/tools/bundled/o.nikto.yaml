id: o.nikto
name: Nikto
tier: optional
binary: nikto
risk: active
params:
  url: { type: target, required: true, description: "The address to scan" }
argv:
  - -h
  - "{url}"
  - -Format
  - csv
  - -output
  - /dev/stdout
  - -nointeractive
  - -ask
  - "no"
  - -Tuning
  - "x6"
version: { args: ["-Version"], pattern: "Nikto[ -]+v?([0-9]+\\.[0-9]+(?:\\.[0-9]+)?)" }
timeout_s: 1800
max_output_mb: 10
parsers: [nikto_csv]
homepage: https://cirt.net/Nikto2
explain: "An old, noisy web server scanner: checks for dangerous files, outdated versions and risky settings."
could_go_wrong: "Very noisy, thousands of requests that any firewall will notice. Denial-of-service tests (the 6 group) are switched off with -Tuning x6."
