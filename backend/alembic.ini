# Alembic reads the database URL from BLINDSPOT_DATABASE_URL (see migrations/env.py), so nothing
# secret or machine specific is kept here.
[alembic]
script_location = migrations
# Migration files are named with the revision first, so they sort in the order they were made.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
