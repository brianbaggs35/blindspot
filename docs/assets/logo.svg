<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128" role="img" aria-labelledby="t d">
  <title id="t">Blindspot</title>
  <desc id="d">Blindspot logo: a radar-like eye with one amber dot marking the blind spot, next to the word Blindspot.</desc>
  <style>
    .word { fill: #0f172a; font: 700 68px/1 "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
    .tag  { fill: #475569; font: 500 15px/1 "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 3.2px; }
    @media (prefers-color-scheme: dark) { .word { fill: #f8fafc; } .tag { fill: #94a3b8; } }
  </style>
  <defs>
    <linearGradient id="ring" x1="14" y1="14" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="sweep" cx="64" cy="64" r="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g>
    <circle cx="64" cy="64" r="52" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="285 41.7" transform="rotate(-38 64 64)"/>
    <circle cx="64" cy="64" r="34" fill="none" stroke="url(#ring)" stroke-width="2.5" opacity="0.55"/>
    <path d="M64 64 L64 14 A50 50 0 0 0 20.7 39 Z" fill="url(#sweep)"/>
    <line x1="64" y1="64" x2="20.7" y2="39" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <circle cx="64" cy="64" r="8" fill="url(#ring)"/>
    <circle cx="94.5" cy="21" r="14" fill="url(#halo)"/>
    <circle cx="94.5" cy="21" r="5.5" fill="#fbbf24"/>
  </g>
  <text class="word" x="146" y="82">Blindspot</text>
  <text class="tag" x="150" y="112">FIND WHAT YOU CANNOT SEE</text>
</svg>
