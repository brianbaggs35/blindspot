# SonarQube Cloud analysis, run by the SonarQube job in .github/workflows/ci.yml. The
# organization and project keys must match SonarQube Cloud's, and the project's Automatic
# Analysis must be off, because CI sends the analysis (and the coverage reports) instead.
sonar.organization=brianbaggs35
sonar.projectKey=brianbaggs35_blindspot
sonar.projectName=Blindspot
sonar.sourceEncoding=UTF-8

# SonarQube Cloud analyses the whole repository (its "analysis scope" setting), so sonar.sources
# and sonar.tests have no effect, and files are told apart as tests by their names and folders
# (tests/, *.test.ts). What is left out: dependencies, build output and the shell scripts' own
# test fixtures.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,.github/scripts/tests/**

sonar.python.version=3.14
# Written by pytest and Vitest in the Backend and Frontend jobs, with a 95% minimum and a
# 100% coverage target.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Coverage is measured on the code that ships. Left out: the tests themselves, and the workflows and
# scripts, which have no unit coverage report (the scripts' own tests are shell).
sonar.coverage.exclusions=backend/tests/**,frontend/tests/**,.github/**

# Each exception below says why, and covers one file, never a whole rule.
