# Findings Trivy should not fail on. Each entry needs a reason and an expiry date, so nothing is
# ignored forever by accident. Empty means everything is fixed or has no fix available.
vulnerabilities: []
misconfigurations:
  # The container's entrypoint and its process supervisor run as root so that each service can be
  # started as its own user (the API and PostgreSQL never run as root, and nginx only as its master). The container runs
  # with every capability dropped except the five that takes. See docs/how-to/container.md.
  - id: AVD-DS-0002
    paths:
      - Dockerfile
    statement: Only the supervisor and nginx's master process run as root; the API, PostgreSQL and the nginx workers run as their own users.
    expired_at: 2027-06-01
secrets:
  # The Anthropic SDK's own docstrings for the beta agents API quote an example service-account
  # object (execution_identity). Trivy matches it as a Google key, but it holds no key: the
  # characters are a placeholder in documentation. Nothing of ours is in these files.
  - id: gcp-service-account
    paths:
      - "**/site-packages/anthropic/**"
    statement: Example text in the Anthropic SDK's docstrings, not a credential.
    expired_at: 2027-06-01
